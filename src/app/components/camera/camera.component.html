<div class="camera-container">
  <!-- Vista previa de la cámara -->
  <video #video autoplay playsinline></video>

  <!-- Botón para capturar -->
  <button (click)="capture()">Tomar foto</button>

  <!-- Canvas invisible, solo para capturar imagen -->
  <canvas #canvas hidden></canvas>

  <!-- Vista de la foto tomada -->
  <img *ngIf="photo" [src]="photo" alt="Foto tomada">
</div>
