<div class="camera-container">
  <div class="camera-frames-row">
    <video #video class="camera-video" autoplay playsinline></video>
    <img *ngIf="photo" class="camera-image" [src]="photo" alt="Foto tomada">
  </div>

  <div class="camera-actions">
    <button (click)="capture()">Tomar foto</button>
  </div>

  <!-- Canvas invisible, solo para capturar imagen -->
  <canvas #canvas hidden></canvas>
</div>
