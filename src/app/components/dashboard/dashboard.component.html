<div class="container">
  <div class="title-container">
    <h2 class="title">Dashboard</h2>
  </div>

  <div class="kpi-grid">
    <mat-card class="kpi-card">
      <mat-card-title>Ingresos</mat-card-title>
      <mat-card-content class="kpi-value">{{ ingresos | currency }}</mat-card-content>
    </mat-card>
    <mat-card class="kpi-card">
      <mat-card-title>Servicios en cola</mat-card-title>
      <mat-card-content class="kpi-value">{{ serviciosEnCola }}</mat-card-content>
    </mat-card>
  </div>

  <div class="chart-grid">
    <mat-card class="chart-card">
      <mat-card-title>Flujo de servicios</mat-card-title>
      <mat-card-content>
        <canvas baseChart [data]="lineChartData" [options]="lineChartOptions" type="line"></canvas>
      </mat-card-content>
    </mat-card>

    <mat-card class="chart-card">
      <mat-card-title>Top mueble</mat-card-title>
      <mat-card-content>
        <canvas baseChart [data]="topMuebleChartData" [options]="barChartOptions" type="bar"></canvas>
      </mat-card-content>
    </mat-card>

    <mat-card class="chart-card">
      <mat-card-title>Top cliente</mat-card-title>
      <mat-card-content>
        <canvas baseChart [data]="topClienteChartData" [options]="barChartOptions" type="bar"></canvas>
      </mat-card-content>
    </mat-card>
  </div>

  <mat-card class="tiempo-proceso-card">
    <mat-card-title>Tiempo de proceso por tipo de servicio</mat-card-title>
    <mat-card-content>
      <table class="tiempo-proceso-table">
        <thead>
          <tr>
            <th>Tipo de servicio</th>
            <th>Días promedio</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let t of tiempoProceso">
            <td>{{ t.tipoDeServicio }}</td>
            <td>{{ t.diasPromedio }}</td>
          </tr>
        </tbody>
      </table>
    </mat-card-content>
  </mat-card>
</div>
