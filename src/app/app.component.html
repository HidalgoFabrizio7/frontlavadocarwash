<!-- Barra principal de navegación -->
<mat-toolbar class="custom-toolbar">

  <div class="toolbar-inner-container">
    <!-- Logo y nombre -->
    <div class="brand-container">
      <img src="image/logocarwash.png" alt="logoicon" class="logoIcon" />
      <span class="website-name">Empresa</span>
    </div>

    <!-- Navegación principal (solo escritorio/tablet) -->
    <nav class="main-nav" *ngIf="isLoggedIn">
      <div class="buttons-container">
        <button mat-button class="menu-btn menu-cliente" [matMenuTriggerFor]="menuCliente">
          <mat-icon>healing</mat-icon> Cliente
        </button>
        <button mat-button class="menu-btn menu-cobranza" [matMenuTriggerFor]="menuCobranza">
          <mat-icon>medication</mat-icon> Cobranza
        </button>
        <button mat-button class="menu-btn menu-mueble" [matMenuTriggerFor]="menuMueble">
          <mat-icon>restaurant</mat-icon> Mueble
        </button>
        <button mat-button class="menu-btn menu-servicio" [matMenuTriggerFor]="menuServicio">
          <mat-icon>people</mat-icon> Servicio
        </button>
        <button mat-button class="menu-btn menu-logout" (click)="cerrarSesion()">
          <mat-icon>logout</mat-icon> Salir
        </button>
      </div>
    </nav>

    <!-- Botón hamburguesa SIEMPRE presente, cambia a X en móvil -->
    <button
      *ngIf="isLoggedIn"
      class="hamburger-menu"
      mat-icon-button
      aria-label="Abrir menú"
      (click)="toggleMobileMenu()">
      <mat-icon>{{ showMobileMenu ? 'close' : 'menu' }}</mat-icon>
    </button>
  </div>
</mat-toolbar>

<!-- Menú móvil desplegable (drawer), SIEMPRE cerrable -->
<nav *ngIf="showMobileMenu && isLoggedIn" class="mobile-menu" role="navigation" aria-label="Menú móvil">
  <button class="close-mobile-menu" mat-icon-button aria-label="Cerrar menú" (click)="closeMobileMenu()">
    <mat-icon>close</mat-icon>
  </button>
  <ul class="mobile-menu-list">
    <!-- Menú Cliente -->
    <li>
      <button mat-button class="mobile-menu-btn"
        (click)="mobileSubMenu = (mobileSubMenu === 'cliente' ? null : 'cliente')"
        [attr.aria-expanded]="mobileSubMenu === 'cliente'">
        <mat-icon>healing</mat-icon> Cliente
        <mat-icon class="submenu-arrow">{{ mobileSubMenu === 'cliente' ? 'expand_less' : 'expand_more' }}</mat-icon>
      </button>
      <ul *ngIf="mobileSubMenu === 'cliente'" class="mobile-submenu-list">
        <li>
          <button mat-button routerLink="/cliente" (click)="closeMobileMenu()">
            <mat-icon>list</mat-icon> Listar
          </button>
        </li>
        <li>
          <button mat-button routerLink="/cliente/nuevocliente" (click)="closeMobileMenu()">
            <mat-icon>person_add</mat-icon> Registrar
          </button>
        </li>
      </ul>
    </li>
    <!-- Menú Cobranza -->
    <li>
      <button mat-button class="mobile-menu-btn"
        (click)="mobileSubMenu = (mobileSubMenu === 'cobranza' ? null : 'cobranza')"
        [attr.aria-expanded]="mobileSubMenu === 'cobranza'">
        <mat-icon>medication</mat-icon> Cobranza
        <mat-icon class="submenu-arrow">{{ mobileSubMenu === 'cobranza' ? 'expand_less' : 'expand_more' }}</mat-icon>
      </button>
      <ul *ngIf="mobileSubMenu === 'cobranza'" class="mobile-submenu-list">
        <li>
          <button mat-button routerLink="/cobranza" (click)="closeMobileMenu()">
            <mat-icon>list</mat-icon> Listar
          </button>
        </li>
        <li>
          <button mat-button routerLink="/cobranza/nuevocobranza" (click)="closeMobileMenu()">
            <mat-icon>add_circle</mat-icon> Registrar
          </button>
        </li>
      </ul>
    </li>
    <!-- Menú Mueble -->
    <li>
      <button mat-button class="mobile-menu-btn"
        (click)="mobileSubMenu = (mobileSubMenu === 'mueble' ? null : 'mueble')"
        [attr.aria-expanded]="mobileSubMenu === 'mueble'">
        <mat-icon>restaurant</mat-icon> Mueble
        <mat-icon class="submenu-arrow">{{ mobileSubMenu === 'mueble' ? 'expand_less' : 'expand_more' }}</mat-icon>
      </button>
      <ul *ngIf="mobileSubMenu === 'mueble'" class="mobile-submenu-list">
        <li>
          <button mat-button routerLink="/mueble" (click)="closeMobileMenu()">
            <mat-icon>list</mat-icon> Listar
          </button>
        </li>
        <li>
          <button mat-button routerLink="/mueble/nuevomueble" (click)="closeMobileMenu()">
            <mat-icon>add_box</mat-icon> Registrar
          </button>
        </li>
        <li>
          <button mat-button routerLink="/mueble/estadomueble" (click)="closeMobileMenu()">
            <mat-icon>add_box</mat-icon> Registrar
          </button>
        </li>
      </ul>
    </li>
    <!-- Menú Servicio -->
    <li>
      <button mat-button class="mobile-menu-btn"
        (click)="mobileSubMenu = (mobileSubMenu === 'servicio' ? null : 'servicio')"
        [attr.aria-expanded]="mobileSubMenu === 'servicio'">
        <mat-icon>people</mat-icon> Servicio
        <mat-icon class="submenu-arrow">{{ mobileSubMenu === 'servicio' ? 'expand_less' : 'expand_more' }}</mat-icon>
      </button>
      <ul *ngIf="mobileSubMenu === 'servicio'" class="mobile-submenu-list">
        <li>
          <button mat-button routerLink="/servicio" (click)="closeMobileMenu()">
            <mat-icon>list</mat-icon> Listar
          </button>
        </li>
        <li>
          <button mat-button routerLink="/servicio/nuevoservicio" (click)="closeMobileMenu()">
            <mat-icon>add</mat-icon> Registrar
          </button>
        </li>
      </ul>
    </li>
    <!-- Cerrar sesión -->
    <li>
      <button mat-button class="mobile-menu-btn" (click)="cerrarSesion()">
        <mat-icon>logout</mat-icon> Salir
      </button>
    </li>
  </ul>
</nav>
