<!-- Barra principal de navegación -->
<mat-toolbar class="custom-toolbar">
  <!-- Contenedor para logo, hamburguesa y nombre -->
  <div class="brand-container">
    <!-- Logo de la empresa -->
    <img src="image/logocarwash.png" alt="logoicon" class="logoIcon">
    <!-- Nombre de la empresa -->
    <span class="website-name">Empresa</span>

    <!-- Botón hamburguesa solo visible en móviles, a la derecha del logo -->
    <button class="hamburger-menu" mat-icon-button (click)="showMobileMenu = !showMobileMenu">
      <mat-icon>{{ showMobileMenu ? 'close' : 'menu' }}</mat-icon>
    </button>

  </div>

  <!-- Navegación principal -->
  <nav class="main-nav">
    <!-- Contenedor de los botones del menú (oculto en móviles) -->
    <div class="buttons-container">
      <!-- Menú Cliente -->
      <button mat-button class="menu-btn menu-cliente" [matMenuTriggerFor]="menuCliente">
        <mat-icon>healing</mat-icon> Cliente
      </button>
      <!-- Menú Cobranza -->
      <button mat-button class="menu-btn menu-cobranza" [matMenuTriggerFor]="menuCobranza">
        <mat-icon>medication</mat-icon> Cobranza
      </button>
      <!-- Menú Mueble -->
      <button mat-button class="menu-btn menu-mueble" [matMenuTriggerFor]="menuMueble">
        <mat-icon>restaurant</mat-icon> Mueble
      </button>
      <!-- Menú Servicio -->
      <button mat-button class="menu-btn menu-servicio" [matMenuTriggerFor]="menuServicio">
        <mat-icon>people</mat-icon> Servicio
      </button>
    </div>
  </nav>
</mat-toolbar>

<!-- Menú móvil desplegable -->
<div *ngIf="showMobileMenu" class="mobile-menu">
  <!-- Menú Cliente -->
  <button mat-button (click)="mobileSubMenu = (mobileSubMenu === 'cliente' ? null : 'cliente')">
    <mat-icon>healing</mat-icon> Cliente
    <mat-icon class="submenu-arrow">{{ mobileSubMenu === 'cliente' ? 'expand_less' : 'expand_more' }}</mat-icon>
  </button>
  <div *ngIf="mobileSubMenu === 'cliente'" class="mobile-submenu">
    <button mat-button routerLink="/cliente" (click)="showMobileMenu = false; mobileSubMenu = null;">
      <mat-icon>list</mat-icon> Listar
    </button>
    <button mat-button routerLink="/cliente/nuevocliente" (click)="showMobileMenu = false; mobileSubMenu = null;">
      <mat-icon>person_add</mat-icon> Registrar
    </button>
  </div>
  <!-- Menú Cobranza -->
  <button mat-button (click)="mobileSubMenu = (mobileSubMenu === 'cobranza' ? null : 'cobranza')">
    <mat-icon>medication</mat-icon> Cobranza
    <mat-icon class="submenu-arrow">{{ mobileSubMenu === 'cobranza' ? 'expand_less' : 'expand_more' }}</mat-icon>
  </button>
  <div *ngIf="mobileSubMenu === 'cobranza'" class="mobile-submenu">
    <button mat-button routerLink="/cobranza" (click)="showMobileMenu = false; mobileSubMenu = null;">
      <mat-icon>list</mat-icon> Listar
    </button>
    <button mat-button routerLink="/cobranza/nuevocobranza" (click)="showMobileMenu = false; mobileSubMenu = null;">
      <mat-icon>add_circle</mat-icon> Registrar
    </button>
  </div>
  <!-- Menú Mueble -->
  <button mat-button (click)="mobileSubMenu = (mobileSubMenu === 'mueble' ? null : 'mueble')">
    <mat-icon>restaurant</mat-icon> Mueble
    <mat-icon class="submenu-arrow">{{ mobileSubMenu === 'mueble' ? 'expand_less' : 'expand_more' }}</mat-icon>
  </button>
  <div *ngIf="mobileSubMenu === 'mueble'" class="mobile-submenu">
    <button mat-button routerLink="/mueble" (click)="showMobileMenu = false; mobileSubMenu = null;">
      <mat-icon>list</mat-icon> Listar
    </button>
    <button mat-button routerLink="/mueble/nuevomueble" (click)="showMobileMenu = false; mobileSubMenu = null;">
      <mat-icon>add_box</mat-icon> Registrar
    </button>
  </div>
  <!-- Menú Servicio -->
  <button mat-button (click)="mobileSubMenu = (mobileSubMenu === 'servicio' ? null : 'servicio')">
    <mat-icon>people</mat-icon> Servicio
    <mat-icon class="submenu-arrow">{{ mobileSubMenu === 'servicio' ? 'expand_less' : 'expand_more' }}</mat-icon>
  </button>
  <div *ngIf="mobileSubMenu === 'servicio'" class="mobile-submenu">
    <button mat-button routerLink="/servicio" (click)="showMobileMenu = false; mobileSubMenu = null;">
      <mat-icon>list</mat-icon> Listar
    </button>
    <button mat-button routerLink="/servicio/nuevoservicio" (click)="showMobileMenu = false; mobileSubMenu = null;">
      <mat-icon>add</mat-icon> Registrar
    </button>
  </div>
</div>
