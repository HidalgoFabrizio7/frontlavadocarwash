<mat-toolbar class="custom-toolbar">
  <img src= "image/logocarwash.png" alt="logoicon" class="logoIcon">

  <span class="website-name">Empresa</span>

  <nav class="main-nav">
    <div class="buttons-container">
      <button mat-button class="menu-btn menu-cliente" [matMenuTriggerFor]="menuCliente">
        <mat-icon>healing</mat-icon> Cliente
      </button>
      <button mat-button class="menu-btn menu-cobranza" [matMenuTriggerFor]="menuCobranza">
        <mat-icon>medication</mat-icon> Cobranza
      </button>
      <button mat-button class="menu-btn menu-mueble" [matMenuTriggerFor]="menuMueble">
        <mat-icon>restaurant</mat-icon> Mueble
      </button>
      <button mat-button class="menu-btn menu-servicio" [matMenuTriggerFor]="menuServicio">
        <mat-icon>people</mat-icon> Servicio
      </button>
    </div>
  </nav>
</mat-toolbar>

<!-- Menús -->
<mat-menu #menuCliente="matMenu" class="menu-dropdown menu-cliente-dropdown">
  <button mat-menu-item routerLink="/cliente" class="menu-item">Listar</button>
  <button mat-menu-item routerLink="/cliente/nuevocliente" class="menu-item">Registrar</button>
</mat-menu>

<mat-menu #menuCobranza="matMenu" class="menu-dropdown menu-cobranza-dropdown">
  <button mat-menu-item routerLink="/cobranza" class="menu-item">Listar</button>
  <button mat-menu-item routerLink="/cobranza/nuevocobranza" class="menu-item">Registrar</button>
</mat-menu>

<mat-menu #menuMueble="matMenu" class="menu-dropdown menu-mueble-dropdown">
  <button mat-menu-item routerLink="/mueble" class="menu-item">Listar</button>
  <button mat-menu-item routerLink="/mueble/nuevomueble" class="menu-item">Registrar</button>
</mat-menu>

<mat-menu #menuServicio="matMenu" class="menu-dropdown menu-servicio-dropdown">
  <button mat-menu-item routerLink="/servicio" class="menu-item">Listar</button>
  <button mat-menu-item routerLink="/servicio/nuevoservicio" class="menu-item">Registrar</button>
</mat-menu>
